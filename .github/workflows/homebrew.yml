name: homebrew

# Updates loophole-ai/homebrew-tap without rebuilding or releasing anything.
# Falls back to npm tarballs, so it works even when no GitHub release exists.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published CLI version for the formula"
        required: true
        default: "1.0.5"
      tap_token:
        description: "Use HOMEBREW_TAP_TOKEN instead of RELEASE_TOKEN"
        type: boolean
        default: false

concurrency:
  group: homebrew-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOOPHOLE_VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      HOMEBREW_TAP_TOKEN: ${{ inputs.tap_token && secrets.HOMEBREW_TAP_TOKEN || secrets.RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun run scripts/homebrew.ts
